<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元素周期表😯</title>
<style>
  :root{
    /* Fluent UI 深色令牌 */
    --bg:#1b1a19;
    --surface:#292827;
    --surface-2:#323130;
    --text:#f3f2f1;
    --text-2:#c8c6c4;
    --text-3:#a19f9d;
    --stroke:#3e3c3a;
    --stroke-strong:#605e5c;
    --accent:#4cc2ff;
    --accent-hover:#79d1ff;
    --radius:4px;
    --head-w:30px;
    --row-h:80px;
    --col-min:66px;
    --shadow-2:0 1.6px 3.6px rgba(0,0,0,.50), 0 .3px .9px rgba(0,0,0,.40);
    --shadow-8:0 6.4px 14.4px rgba(0,0,0,.55), 0 1.2px 3.6px rgba(0,0,0,.45);
    --shadow-16:0 12.8px 28.8px rgba(0,0,0,.65), 0 2.4px 7.2px rgba(0,0,0,.50);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI","Segoe UI Web (West European)","Microsoft YaHei","PingFang SC",Arial,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button,input{font-family:inherit}
  .app{max-width:1560px;margin:0 auto;padding:24px 28px 40px}

  /* ---------- header ---------- */
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:28px;font-weight:600;letter-spacing:-.4px;margin:0 0 4px}
  .subtitle{color:var(--text-2);font-size:13px;margin:0}
  .subtitle b{color:var(--accent);font-weight:600}
  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{
    display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;
    background:var(--surface);border:1px solid var(--stroke-strong);border-radius:var(--radius);
    min-width:240px;transition:border-color .15s,box-shadow .15s;
  }
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px rgba(76,194,255,.20)}
  .search svg{flex:none;fill:var(--text-3)}
  .search input{border:0;outline:0;background:transparent;width:100%;font-size:13px;color:var(--text)}
  .search input::placeholder{color:var(--text-3)}
  .btn{
    height:36px;padding:0 14px;background:var(--surface);color:var(--text);
    border:1px solid var(--stroke-strong);border-radius:var(--radius);cursor:pointer;
    font-size:13px;transition:background .15s,border-color .15s;
  }
  .btn:hover{background:var(--surface-2);border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#1b1a19;border-color:var(--accent);font-weight:600}
  .btn.primary:hover{background:var(--accent-hover)}

  /* ---------- legend ---------- */
  .legend{
    display:flex;flex-wrap:wrap;gap:6px;background:var(--surface);border:1px solid var(--stroke);
    border-radius:var(--radius);padding:10px 12px;margin-bottom:16px;box-shadow:var(--shadow-2);
    align-items:center;
  }
  .legend-title{font-size:12px;color:var(--text-2);margin-right:6px;font-weight:600}
  .chip{
    display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
    border:1px solid transparent;border-radius:var(--radius);font-size:12px;cursor:pointer;
    color:var(--text);background:transparent;transition:box-shadow .12s,transform .12s;
  }
  .chip:hover{box-shadow:var(--shadow-2)}
  .chip.active{border-color:var(--text-3);box-shadow:inset 0 0 0 1px var(--text-3)}
  .chip .sw{width:12px;height:12px;border-radius:2px;border:1px solid var(--stroke-strong);flex:none}
  .chip.dim{opacity:.4}
  .legend-sep{width:1px;height:18px;background:var(--stroke);margin:0 6px}
  .radio-note{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#ff6b6b;font-weight:600}
  .radio-note .ico{font-size:13px}

  /* ---------- table ---------- */
  .table-scroll{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:4px 2px 12px;-webkit-overflow-scrolling:touch}
  .table-inner{min-width:1290px}
  .col-band,.body-band{display:grid;grid-template-columns:var(--head-w) minmax(0,1fr);gap:4px}
  .corner{border-right:1px solid var(--stroke)}
  .col-heads{display:grid;grid-template-columns:repeat(18,minmax(var(--col-min),1fr));gap:4px}
  .col-heads div{
    display:flex;align-items:center;justify-content:center;height:22px;
    font-size:11px;font-weight:600;color:var(--text-3);
    background:var(--surface);border:1px solid var(--stroke);border-radius:2px;
    font-variant-numeric:tabular-nums;
  }
  .row-heads{
    display:grid;
    grid-template-rows:repeat(7,var(--row-h)) 14px repeat(2,var(--row-h));
    gap:4px;
  }
  .row-heads div{
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--stroke);border-radius:2px;background:var(--surface);
    font-size:12px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums;
  }
  .ptable{
    display:grid;
    grid-template-columns:repeat(18,minmax(var(--col-min),1fr));
    grid-template-rows:repeat(7,var(--row-h)) 14px repeat(2,var(--row-h));
    gap:4px;width:100%;
  }
  .el{
    --el-text:var(--text);
    --el-sub:var(--text-2);
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:2px;
    padding:13px 3px 4px;border:1px solid var(--border);border-top:3px solid var(--border-strong);
    border-radius:3px;background:var(--fill);cursor:pointer;overflow:hidden;
    transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
    user-select:none;min-width:0;
  }
  .el:hover{transform:translateY(-2px);box-shadow:var(--shadow-8);z-index:3}
  .el:focus-visible{outline:2px solid var(--accent);outline-offset:1px;z-index:4}
  .el.dim{opacity:.22;filter:grayscale(.6)}
  .el.hit{box-shadow:0 0 0 2px var(--accent),var(--shadow-8);z-index:5}
  .el .num{position:absolute;top:5px;left:5px;font-size:10px;line-height:1;color:var(--el-sub);font-variant-numeric:tabular-nums}
  .el .sym{font-size:23px;line-height:1;font-weight:600;letter-spacing:-.5px;color:var(--el-text);width:100%}
  .el .cn{font-size:11px;line-height:1;color:var(--el-text);font-weight:500;width:100%}
  .el .mass{font-size:9px;line-height:1;color:var(--el-sub);font-variant-numeric:tabular-nums;width:100%}
  .el .fam{font-size:8px;line-height:1;color:var(--el-sub);white-space:nowrap;max-width:100%;width:100%;overflow:hidden;text-overflow:ellipsis}
  .el .radio-mark{
    position:absolute;top:4px;right:4px;font-size:10px;color:#ff5252;line-height:1;
    font-weight:700;
  }
  .el.radioactive{--el-text:#ff6b6b;--el-sub:#ff8a8a;border-top-color:#e52b2b}
  .placeholder{
    display:flex;align-items:center;justify-content:center;text-align:center;
    border:1px dashed var(--stroke-strong);border-radius:3px;background:#242322;
    color:var(--text-2);font-size:10px;line-height:1.4;padding:4px;cursor:default;
  }
  .fblock-label{
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
    color:var(--text-2);border-right:1px solid var(--stroke);
  }
  .spacer{grid-column:1/-1;height:14px}

  /* category tokens — 深色底色 + 明亮描边 */
  .c-alkali      {--fill:#3b2a2e;--border:#5c3d45;--border-strong:#e08a9a}
  .c-alkaline    {--fill:#3b3323;--border:#5c5030;--border-strong:#e8c46a}
  .c-transition  {--fill:#243548;--border:#34506c;--border-strong:#6fb3f0}
  .c-post        {--fill:#2b3640;--border:#3d5160;--border-strong:#8fbad6}
  .c-metalloid   {--fill:#332a40;--border:#4c3d5e;--border-strong:#bb96e0}
  .c-nonmetal    {--fill:#23382e;--border:#335444;--border-strong:#79cf9c}
  .c-halogen     {--fill:#3d3026;--border:#5e4937;--border-strong:#eda46d}
  .c-noble       {--fill:#2b2e45;--border:#3f4468;--border-strong:#9ba7ee}
  .c-lanthanide  {--fill:#382a3c;--border:#553f5a;--border-strong:#d49ddd}
  .c-actinide    {--fill:#3b2733;--border:#5c3a4c;--border-strong:#e394bb}
  .c-unknown     {--fill:#333332;--border:#4a4a49;--border-strong:#b0aeac}

  .footer{margin-top:10px;color:var(--text-3);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  /* ---------- dialog ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;
    padding:24px;z-index:50;animation:fade .12s ease-out;
  }
  .overlay[hidden]{display:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  .dialog{
    width:min(900px,100%);max-height:88vh;overflow:auto;background:var(--surface);
    border:1px solid var(--stroke);border-radius:6px;box-shadow:var(--shadow-16);animation:pop .16s ease-out;
  }
  .dlg-head{display:flex;gap:14px;align-items:center;padding:16px 20px 14px;border-bottom:1px solid var(--stroke)}
  .dlg-badge{
    width:56px;height:56px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1px solid var(--border);border-top:3px solid var(--border-strong);border-radius:4px;background:var(--fill);
  }
  .dlg-badge .s{font-size:24px;font-weight:600;line-height:1;color:var(--text)}
  .dlg-badge .n{font-size:10px;color:var(--text-2);margin-top:3px}
  .dlg-titles{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;column-gap:10px;row-gap:6px}
  .dlg-titles h2{font-size:20px;font-weight:600;margin:0;line-height:1.2;white-space:nowrap}
  .dlg-en{color:var(--text-2);font-size:12px;margin:0}
  .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tag{font-size:11px;padding:3px 8px;border-radius:2px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--stroke);white-space:nowrap}
  .tag.cat{background:var(--fill);border-color:var(--border);color:var(--text)}
  .tag.rad{background:#3b2a2e;border-color:#6d3b45;color:#ff8a8a;font-weight:600}
  .close{
    flex:none;width:32px;height:32px;border:0;background:transparent;border-radius:var(--radius);
    color:var(--text-2);font-size:16px;cursor:pointer;line-height:1;align-self:flex-start;
  }
  .close:hover{background:var(--surface-2);color:var(--text)}
  .dlg-body{padding:14px 20px 16px}
  .group-cap{font-size:11px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px;margin:0 0 6px}
  .group-cap:before{content:"";width:3px;height:12px;background:var(--accent);border-radius:2px;flex:none}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}
  .info-card{background:var(--surface-2);border:1px solid var(--stroke);border-radius:3px;padding:9px 11px;min-width:0}
  .info-card .k{display:block;font-size:10px;color:var(--text-2);margin-bottom:3px}
  .info-card .v{display:block;font-size:13px;font-weight:600;color:var(--text);line-height:1.35;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .info-card .v.rad{color:#ff8a8a}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:8px;margin-top:10px}
  .detail-card{background:var(--surface-2);border:1px solid var(--stroke);border-radius:3px;padding:11px 13px;min-width:0}
  .detail-card.wide{grid-column:1/-1}
  .detail-card .k{font-size:11px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .detail-card .k:before{content:"";width:3px;height:12px;background:var(--accent);border-radius:2px;flex:none}
  .detail-card .v{font-size:12.5px;line-height:1.65;color:var(--text);overflow-wrap:anywhere}
  .dlg-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 20px 16px;flex-wrap:wrap}
  .foot-hint{font-size:11px;color:var(--text-3)}

  /* ---------- tooltip ---------- */
  .tooltip{
    position:fixed;z-index:60;pointer-events:none;background:#1f1e1d;color:#f3f2f1;border:1px solid var(--stroke-strong);
    border-radius:3px;padding:9px 11px;font-size:12px;line-height:1.6;box-shadow:var(--shadow-8);max-width:250px;
  }
  .tooltip[hidden]{display:none}
  .tooltip b{font-size:13px}
  .tooltip .tt-sub{color:#c8c6c4}
  .tooltip .tt-rad{color:#ff9a9a;font-weight:600}

  /* ---------- responsive ---------- */
  @media (max-width:1100px){
    :root{--col-min:58px;--row-h:74px;--head-w:26px}
    .table-inner{min-width:1142px}
    .el .sym{font-size:20px}
    .el .cn{font-size:10px}
    .el .mass,.el .fam{font-size:8px}
  }
  @media (max-width:820px){
    :root{--col-min:50px;--row-h:68px;--head-w:24px}
    .table-inner{min-width:996px}
    .app{padding:16px 12px 28px}
    h1{font-size:23px}
    .topbar{gap:14px}
    .tools{width:100%}
    .search{flex:1;min-width:0}
    .legend{padding:8px 10px;gap:4px}
    .chip{height:26px;padding:0 8px;font-size:11px}
    .info-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .detail-grid{grid-template-columns:1fr}
    .el{padding:13px 2px 4px;gap:1px}
    .el .sym{font-size:18px}
    .el .cn{font-size:9px}
    .el .mass,.el .fam{font-size:7px}
    .el .num{font-size:8px;top:3px;left:3px}
    .el .radio-mark{font-size:8px;top:3px;right:3px}
    .col-heads div{font-size:10px;height:18px}
    .row-heads div{font-size:10px}
    .fblock-label{font-size:10px}
    .placeholder{font-size:8px}
  }
  @media (max-width:560px){
    :root{--col-min:40px;--row-h:64px;--head-w:20px}
    .table-inner{min-width:812px}
    .app{padding:12px 8px 24px}
    h1{font-size:20px}
    .subtitle{font-size:11px}
    .search{height:34px}
    .btn{height:34px;padding:0 10px;font-size:12px}
    .legend-title{width:100%;margin:0 0 2px}
    .legend-sep{display:none}
    .el{padding:12px 1px 3px;border-top-width:2px}
    .el .sym{font-size:15px}
    .el .cn{font-size:9px}
    .el .mass,.el .fam{font-size:7px}
    .el .num{font-size:7px;top:2px;left:2px}
    .el .radio-mark{font-size:7px;top:2px;right:2px}
    .col-heads div{font-size:9px;height:16px}
    .row-heads div{font-size:9px}
    .fblock-label{font-size:9px}
    .footer{font-size:10px}
    .overlay{padding:10px}
    .dlg-head{padding:14px 14px 12px;gap:10px}
    .dlg-badge{width:44px;height:44px}
    .dlg-badge .s{font-size:19px}
    .dlg-titles h2{font-size:18px}
    .dlg-en{font-size:11px}
    .dlg-body{padding:12px 14px 14px}
    .dlg-foot{padding:0 14px 14px}
    .foot-hint{display:none}
  }
  @media (max-width:380px){
    .info-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>元素周期表</h1>
      <p class="subtitle">目前已发现 118 种元素 · 点击任意元素查看详情</p>
    </div>
    <div class="tools">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"/></svg>
        <input id="search" type="search" placeholder="搜索名称 / 符号 / 原子序数" autocomplete="off">
      </label>
      <button class="btn" id="clearBtn" type="button">清除筛选</button>
    </div>
  </header>

  <div class="legend" id="legend">
    <span class="legend-title">元素类别</span>
  </div>

  <div class="table-scroll">
    <div class="table-inner">
      <div class="col-band">
        <div class="corner" aria-hidden="true"></div>
        <div class="col-heads" id="colHeads" aria-hidden="true"></div>
      </div>
      <div class="body-band">
        <div class="row-heads" id="rowHeads" aria-hidden="true"></div>
        <div class="ptable" id="ptable" aria-label="元素周期表"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>☢ 标记表示该元素所有同位素均具有放射性（含 43、61 及 84 号以后元素，另含铋）</span>
    <span>密度单位：固体/液体 g·cm⁻³，气体 g·L⁻¹；温度单位：°C</span>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-head">
      <div class="dlg-badge" id="dlgBadge"></div>
      <div class="dlg-titles">
        <h2 id="dlgTitle"></h2>
        <div class="dlg-en" id="dlgEn"></div>
        <div class="tags" id="dlgTags"></div>
      </div>
      <button class="close" id="closeBtn" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-foot">
      <span class="foot-hint">按 Esc 或点击空白处可关闭</span>
      <button class="btn primary" id="okBtn" type="button">关闭</button>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip" hidden></div>

<script>
/* 数据字段：[原子序数, 符号, 中文名, 相对原子质量, 类别, 密度, 熔点, 沸点, 放射性, 半衰期, 同位素, 化学性质] */
const D = [
[1,"H","氢","1.008","nonmetal","0.00008988","−259.16","−252.87",0,"稳定（³H 半衰期 12.32 年）","¹H 氕、²H 氘、³H 氚（放射性）","非金属，可燃；与氧结合生成水，常见化合价 +1、−1"],
[2,"He","氦","4.0026","noble","0.0001785","−272.2（加压）","−268.93",0,"稳定","³He、⁴He","惰性气体，几乎不形成化合物；通电发黄光"],
[3,"Li","锂","6.94","alkali","0.534","180.5","1342",0,"稳定","⁶Li、⁷Li","活泼金属，与水反应生成氢氧化锂和氢气；化合价 +1"],
[4,"Be","铍","9.0122","alkaline","1.85","1287","2469",0,"稳定","⁹Be","两性金属，表面生成致密氧化膜；化合价 +2"],
[5,"B","硼","10.81","metalloid","2.34","2076","3927",0,"稳定","¹⁰B、¹¹B","类金属，形成硼酸与硼酸盐；化合价 +3"],
[6,"C","碳","12.011","nonmetal","2.267","3550（升华）","4027",0,"稳定（¹⁴C 半衰期 5730 年）","¹²C、¹³C、¹⁴C","有机物基础元素，可形成丰富共价化合物；化合价 +4、−4、+2"],
[7,"N","氮","14.007","nonmetal","0.0012506","−210","−195.79",0,"稳定","¹⁴N、¹⁵N","常温下很稳定，高温下与氧化合生成 NO；化合价 −3 ～ +5"],
[8,"O","氧","15.999","nonmetal","0.001429","−218.79","−182.95",0,"稳定","¹⁶O、¹⁷O、¹⁸O","强氧化性，支持燃烧，是多数氧化物的组成元素；常见化合价 −2"],
[9,"F","氟","18.998","halogen","0.001696","−219.67","−188.11",0,"稳定","¹⁹F","最活泼的非金属，几乎能与所有元素反应；化合价 −1"],
[10,"Ne","氖","20.180","noble","0.0008999","−248.59","−246.05",0,"稳定","²⁰Ne、²¹Ne、²²Ne","惰性气体，通电发出橙红色光，用于霓虹灯"],

const CAT = {
  alkali:     {name:"碱金属",     short:"碱金属"},
  alkaline:   {name:"碱土金属",   short:"碱土金属"},
  transition: {name:"过渡金属",   short:"过渡金属"},
  post:       {name:"后过渡金属", short:"后过渡金属"},
  metalloid:  {name:"类金属",     short:"类金属"},
  nonmetal:   {name:"非金属",     short:"非金属"},
  halogen:    {name:"卤族",       short:"卤族"},
  noble:      {name:"稀有气体",   short:"稀有气体"},
  lanthanide: {name:"镧系（稀土金属）", short:"镧系"},
  actinide:   {name:"锕系（放射性金属）", short:"锕系"},
  unknown:    {name:"性质未知（超重元素）", short:"性质未知"}
};

function pos(n){
  if(n<=2) return {p:1,g:n===1?1:18};
  if(n<=10) return {p:2,g:n<=4?n-2:n+8};
  if(n<=18) return {p:3,g:n<=12?n-10:n};
  if(n<=36) return {p:4,g:n-18};
  if(n<=54) return {p:5,g:n-36};
  if(n<=86){
    if(n<=56) return {p:6,g:n-54};
    if(n<=71) return {p:6,g:3,f:"lan"};
    return {p:6,g:n-68};
  }
  if(n<=88) return {p:7,g:n-86};
  if(n<=103) return {p:7,g:3,f:"act"};
  return {p:7,g:n-100};
}

function family(n,cat,g){
  if(cat==="alkali" && n===1) return "氢：非金属，位于第 1 族";
  if(cat==="alkali") return "碱金属（第 1 族，不含氢）";
  if(cat==="alkaline") return "碱土金属（第 2 族）";
  if(cat==="halogen") return "卤族（第 17 族）";
  if(cat==="noble") return "稀有气体（第 18 族）";
  if(cat==="lanthanide") return "镧系 · 稀土金属（f 区）";
  if(cat==="actinide") return "锕系 · 放射性金属（f 区）";
  if(cat==="transition") return "过渡金属（第 "+g+" 族，d 区）";
  if(cat==="post") return "后过渡金属（第 "+g+" 族，p 区）";
  if(cat==="metalloid") return "类金属（第 "+g+" 族）";
  if(cat==="nonmetal") return "非金属（第 "+g+" 族）";
  return "性质未知（第 "+g+" 族，超重元素）";
}

function makeTile(e,row,col){
  const [n,sym,cn,mass,cat,density,melt,boil,radio,half,iso,chem]=e;

  const el=document.createElement("div");
  el.className="el c-"+cat+(radio?" radioactive":"");
  el.style.gridRow=row; el.style.gridColumn=col;
  el.tabIndex=0; el.setAttribute("role","button");
  el.setAttribute("aria-label",`${cn} ${sym}，原子序数 ${n}，${CAT[cat].name}${radio?"，放射性元素":""}`);
  el.dataset.n=n; el.dataset.cat=cat;
  el.innerHTML=
    '<span class="num">'+n+'</span>'+
    (radio?'<span class="radio-mark" aria-label="放射性">☢</span>':'')+
    '<span class="sym">'+sym+'</span>'+
    '<span class="cn">'+cn+'</span>'+
    '<span class="mass">'+mass+'</span>'+
    '<span class="fam">'+CAT[cat].short+'</span>';
  el.addEventListener("click",()=>openDialog(e));
  el.addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();openDialog(e);} });
  el.addEventListener("mouseenter",ev=>showTip(ev,e));
  el.addEventListener("mousemove",moveTip);
  el.addEventListener("mouseleave",()=>{tooltip.hidden=true;});
  ptable.appendChild(el);
}

/* ---------- tooltip ---------- */
function showTip(ev,e){
  const p=pos(e[0]);
  tooltip.innerHTML='<b>'+e[2]+' '+e[1]+'</b> <span class="tt-sub">#'+e[0]+'</span><br>'+
    '第 '+p.p+' 周期 · '+(p.f?"f 区（第 3 族）":"第 "+p.g+" 族")+'<br>'+
    '<span class="tt-sub">'+family(e[0],e[4],p.g)+'</span><br>'+
    (e[8]?'<span class="tt-rad">☢ 放射性元素 · '+e[9]+'</span>':'<span class="tt-sub">稳定元素</span>');
  tooltip.hidden=false; moveTip(ev);
}
function moveTip(ev){
  if(tooltip.hidden) return;
  let x=ev.clientX+14, y=ev.clientY+14;
  const r=tooltip.getBoundingClientRect();
  if(x+r.width>innerWidth-8) x=ev.clientX-r.width-14;
  if(y+r.height>innerHeight-8) y=ev.clientY-r.height-14;
  tooltip.style.left=x+"px"; tooltip.style.top=y+"px";
}

/* ---------- filter ---------- */
const SYMBOL_SET = new Set(D.map(e=>e[1].toLowerCase()));
function matches(e,q){
  if(!q) return true;
  const ql=q.toLowerCase();
  const sym=e[1].toLowerCase();
  // 输入恰好是某个元素符号时，只匹配该符号，避免 "Li" 误命中 "Beryllium" 等英文名中的片段
  if(SYMBOL_SET.has(ql)) return sym===ql;
  if(sym===ql) return true;
  if(String(e[0])===ql) return true;
  if(e[2].includes(q)) return true;
  const en=EN[e[0]-1].toLowerCase();
  if(en===ql||en.startsWith(ql)) return true;
  return CAT[e[4]].name.includes(q);
}
function applyFilter(){
  const q=search.value.trim();
  document.querySelectorAll(".el").forEach(el=>{
    const e=D[Number(el.dataset.n)-1];
    const okQ=matches(e,q);
    const okC=!activeCat||e[4]===activeCat;
    const ok=okQ&&okC;
    el.classList.toggle("dim",!ok);
    el.classList.toggle("hit",!!q&&ok);
  });
  document.querySelectorAll(".chip").forEach(c=>{
    c.classList.toggle("active",c.dataset.cat===activeCat);
    c.classList.toggle("dim",!!activeCat&&c.dataset.cat!==activeCat);
  });
}
search.addEventListener("input",applyFilter);
document.getElementById("clearBtn").addEventListener("click",()=>{
  search.value=""; activeCat=null; applyFilter(); search.focus();
});

/* ---------- dialog ---------- */
function openDialog(e){
  const [n,sym,cn,mass,cat,density,melt,boil,radio,half,iso,chem]=e;
  const p=pos(n);
  const badge=document.getElementById("dlgBadge");
  badge.className="dlg-badge c-"+cat+(radio?" radioactive":"");
  badge.innerHTML='<span class="s">'+sym+'</span><span class="n">'+n+'</span>';
  document.getElementById("dlgTitle").textContent=cn+" · "+sym;
  document.getElementById("dlgEn").textContent=EN[n-1];
  document.getElementById("dlgTags").innerHTML=
    (radio?'<span class="tag rad">☢ 放射性元素</span>':'<span class="tag">稳定元素</span>')+
    '<span class="tag cat">'+CAT[cat].name+'</span>'+
    '<span class="tag">第 '+p.p+' 周期</span>'+
    '<span class="tag">'+(p.f?"f 区（第 3 族）":"第 "+p.g+" 族")+'</span>';

  const props=[
    ["原子序数",n,""], ["相对原子质量",mass,""],
    ["密度",density+" "+(density.startsWith("0.")?"g·L⁻¹":"g·cm⁻³"),""],
    ["熔点",melt+" °C",""], ["沸点",boil+" °C",""],
    ["半衰期",half,radio?"rad":""]
  ];
  const html='<div class="group-cap">基本物理属性</div>'+
    '<div class="info-grid">'+
      props.map(x=>'<div class="info-card"><span class="k">'+x[0]+'</span><span class="v '+x[2]+'">'+x[1]+'</span></div>').join("")+
    '</div>'+
    '<div class="detail-grid">'+
      '<div class="detail-card wide"><div class="k">族内元素性质</div><div class="v">'+family(n,cat,p.g)+'</div></div>'+
      '<div class="detail-card"><div class="k">化学性质</div><div class="v">'+chem+'</div></div>'+
      '<div class="detail-card"><div class="k">同位素</div><div class="v">'+iso+'</div></div>'+
    '</div>';
  document.getElementById("dlgBody").innerHTML=html;
  overlay.hidden=false;
  document.getElementById("closeBtn").focus();
}
function closeDialog(){ overlay.hidden=true; tooltip.hidden=true; }
